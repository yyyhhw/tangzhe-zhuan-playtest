<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>首批原创六卡 · 插画预览（只展示）</title>
<style>body{font-family:system-ui,sans-serif;background:#f7f1e3;margin:0;padding:12px;color:#2b2118}h1{font-size:18px}.note{color:#7a5230;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.c{background:#fffaf0;border:2px solid #2b2118;border-radius:10px;padding:6px;text-align:center}
.c .frame{aspect-ratio:448/560;background:#e9dcc6;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center}.c img{width:100%;height:100%;object-fit:contain}
.c .ph{font-size:12px;color:#7a5230}.c b{display:block;margin-top:4px}.c small{color:#7a5230}</style></head>
<body><h1>首批原创六卡 · 插画预览</h1>
<p class="note">仅展示与图鉴预览：这六张卡尚未进入卡牌引擎，不进卡池、不进牌组；费用、数值与稀有度另行复核。</p>
<div class="grid" id="grid"></div>
<script type="module">
import {ART_BY_SOURCE_ID, PREVIEW_ONLY_CARDS, artForSource} from './presentation.mjs?v=tzz-original-art-1';
const CLS={warrior:'战士',mage:'法师',paladin:'圣骑士',warlock:'术士',neutral:'中立'};
const g=document.getElementById('grid');
for(const c of PREVIEW_ONLY_CARDS){const a=artForSource(c.sourceId);const d=document.createElement('div');d.className='c';d.dataset.sourceId=c.sourceId;d.dataset.cardId=c.cardId;
 const f=document.createElement('div');f.className='frame';
 if(a){const im=new Image();im.src=a.src;im.alt=a.alt||c.name;im.width=a.width;im.height=a.height;im.onerror=()=>{im.remove();f.innerHTML='<span class="ph">图示暂不可用</span>';};f.append(im);}else f.innerHTML='<span class="ph">图示暂不可用</span>';
 d.append(f);const b=document.createElement('b');b.textContent=c.name;const s=document.createElement('small');s.textContent=(CLS[c.classId]||'中立')+' · 仅展示';d.append(b,s);g.append(d);}
window.__artPreview={count:PREVIEW_ONLY_CARDS.length,mapped:PREVIEW_ONLY_CARDS.filter(c=>ART_BY_SOURCE_ID[c.sourceId]).length};
</script></body></html>
