<!doctype html>
<html lang="zh-CN">
<head>
<!-- 打僵尸 z3：单独打开 = 原型（模拟余额，只存 tangzhe-zombie-proto）；经营页用 ?embed=1 嵌入 = 共用经营金币，由经营页扣款写档。角色造型复用 ../art。 -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f7f1e3">
<meta name="format-detection" content="telephone=no">
<title>77 打僵尸</title>
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="zombie.css?v=z10">
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hidden">
  <div class="hud-top">
    <div class="hp"><i id="hpFill"></i><b id="hpTxt">100</b></div>
    <div class="clock" id="clock">3:00</div>
    <button class="icon-btn" id="pauseBtn" type="button" aria-label="暂停">II</button>
  </div>
  <div class="hud-sub"><span id="killTxt">击倒 0</span><span id="lvlTxt"></span><span id="skewTxt">飞串 ×3</span></div>
  <button id="ultBtn" type="button" aria-label="大招：火圈" disabled><span class="ult-fill" id="ultFill"></span><span class="ult-lbl">火圈</span></button>
  <div id="toast" class="toast"></div>
</div>

<section id="menu" class="screen">
  <button class="buy hidden" id="exitBtn" type="button">‹ 返回经营</button>
  <div class="card hero">
    <img src="../art/face_c77.webp" alt="77" width="96" height="96">
    <div>
      <h1 id="heroName">77 打僵尸</h1>
      <p id="heroDesc">拖动屏幕走位，自动扔飞串；能量满了放<b>火圈</b>。撑到倒计时结束就过关，共 50 关，通关后开放无尽模式。</p>
      <p class="note" id="heroNote"></p>
    </div>
  </div>
  <div class="card">
    <div class="row"><h2>选关</h2><span class="wallet" id="lvProg"></span></div>
    <div class="lvsel"><button class="buy" id="lvPrev" type="button" aria-label="上一关">‹</button><div><b id="lvTxt">第 1 关</b><small id="lvInfo"></small></div><button class="buy" id="lvNext" type="button" aria-label="下一关">›</button></div>
    <button class="buy" id="endlessBtn" type="button" disabled>无尽模式</button>
  </div>
  <div class="card">
    <div class="row"><h2>战斗训练</h2><span class="wallet"><span id="walletLbl">模拟余额</span> <b id="walletTxt">0</b></span></div>
    <p class="note" id="trainNote">单独打开是原型模式：用模拟金币，不碰经营存档。</p>
    <p class="note">四位 CEO 共用训练等级，切换角色会沿用；下方显示现任 CEO 的技能。</p>
    <div id="train"></div>
  </div>
  <button class="buy big red" id="startBtn" type="button">开打！</button>
</section>

<section id="pause" class="screen dim hidden">
  <div class="card center">
    <h2>暂停中</h2>
    <button class="buy big" id="resumeBtn" type="button">继续</button>
    <button class="buy" id="sndBtn" type="button">声音：开</button>
    <button class="buy" id="quitBtn" type="button">退出本局</button>
  </div>
</section>

<section id="result" class="screen dim hidden">
  <div class="card center">
    <h2 id="resTitle">撑住了！</h2>
    <p id="resStats"></p>
    <p class="note" id="resNote"></p>
    <button class="buy hidden" id="retryBtn" type="button">重试保存</button>
    <button class="buy big red" id="againBtn" type="button">再来一局</button>
    <button class="buy" id="menuBtn" type="button">回训练</button>
  </div>
</section>

<script src="zbcore.js?v=z10"></script>
<script src="zbsfx.js?v=z10"></script>
<script src="zombie.js?v=13k-night2"></script>
</body>
</html>
