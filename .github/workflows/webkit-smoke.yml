name: WebKit/iOS smoke

# Scoped to our session branch for now: manual dispatch + pushes to the branch.
# Deliberately NOT triggered on main or on pull_request.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: '要测的游戏代码 ref（分支名或完整 SHA；留空=本工作流所在提交）。测试脚本始终用本工作流所在提交的 tests/webkit-smoke。'
        required: false
        default: ''
  push:
    branches:
      - claude/slack-session-qotgmg
      - 'wangdama/test130-*'
      - 'wangdama/162-*'
      - 'wangdama/163-*'

permissions:
  contents: read

jobs:
  webkit-smoke:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: tests/webkit-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      # 测试-163：手动传 ref 时，游戏代码用该 ref，测试脚本仍用本工作流所在提交（31/43 的 SHA 里可能没有 scenarios-162）。
      - name: Use this commit's tests/webkit-smoke
        if: ${{ inputs.ref }}
        working-directory: .
        run: |
          git checkout ${{ github.sha }} -- tests/webkit-smoke
          echo "game code: $(git rev-parse HEAD)  tests: ${{ github.sha }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install WebKit browser
        run: npx playwright install --with-deps webkit

      - name: Run WebKit smoke
        env:
          WEBKIT_SMOKE_OUT: ${{ github.workspace }}/tests/webkit-smoke/output
        run: node webkit-smoke.mjs

      - name: Run 测试-130 ①–④ scenarios (WebKit)
        if: always()
        env:
          WEBKIT_SMOKE_OUT: ${{ github.workspace }}/tests/webkit-smoke/output
        run: node scenarios-130.mjs

      # 测试-163：家宅-31/43 非作者交叉测（WebKit 部分）。单步失败不影响上面两步的结论；报告 report-162.json 随 artifact 上传。
      - name: Run 测试-162 家宅-31/43 scenarios (WebKit)
        if: always()
        continue-on-error: true
        env:
          WEBKIT_SMOKE_OUT: ${{ github.workspace }}/tests/webkit-smoke/output
          ENGINES: webkit
        run: node scenarios-162.mjs

      # 文案-87 高风险代验（王大妈，非作者）：预览升级/首进文案 + 旧档/刷新/正式不弹提示（WebKit 两个宽度）。
      - name: Run 文案-87 scenarios (WebKit)
        if: always()
        continue-on-error: true
        env:
          WEBKIT_SMOKE_OUT: ${{ github.workspace }}/tests/webkit-smoke/output
          ENGINES: webkit
        run: node scenarios-87.mjs

      - name: Upload screenshots + report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-smoke-output
          path: tests/webkit-smoke/output
          if-no-files-found: warn
