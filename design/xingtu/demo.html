<title>星途 试玩 Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700;900&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
/* 布局：手机竖屏单列，沿用《躺着也能赚》的漫画描边风；街道用米色，太空用深蓝 */
:root{
  --paper:#f7f1e3; --card:#fffaf0; --ink:#141414; --sub:#4a4540; --mute:#8a847a;
  --yellow:#ffd23f; --red:#e63946; --space:#14213d; --space2:#1d3557; --star:#e9f1ff;
  --life:#c8743a; --med:#e58aa8; --war:#6b4fd8; --tech:#2f6fb5; --good:#2a9d8f;
  --disp:'ZCOOL KuaiLe','Noto Sans SC',system-ui,sans-serif; --font:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;padding-inline:16px;-webkit-tap-highlight-color:transparent}
.app{max-width:430px;margin:0 auto;padding-block:14px 90px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;text-wrap:balance}
button{font-family:inherit;cursor:pointer;color:var(--ink)}
button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.box{background:var(--card);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.btn{border:2.5px solid var(--ink);background:var(--yellow);font-weight:900;font-size:15px;padding:9px 14px;box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn[disabled]{background:#ece8df;color:var(--mute);box-shadow:none;cursor:not-allowed}
.btn.ghost{background:var(--card)}
.btn.small{font-size:13px;padding:5px 10px}
.tag{display:inline-block;font-size:11px;font-weight:900;padding:1px 6px;border:1.5px solid var(--ink);background:var(--card)}
.muted{color:var(--sub);font-size:12px}
.num{font-variant-numeric:tabular-nums}

/* 顶部金币条 */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--card);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.hud .coin{font-weight:900;font-size:18px}
.hud .rate{font-size:12px;color:var(--sub)}
.hud .pts{margin-left:auto;text-align:right;font-weight:900}
.hud .pts small{display:block;font-size:11px;color:var(--sub);font-weight:700}

/* 街道 / 入口 */
.street{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.shop{padding:10px;display:flex;flex-direction:column;gap:2px}
.shop b{font-size:15px}
.shop .ok{color:var(--good);font-weight:900;font-size:12px}
.pad{position:relative;overflow:hidden;background:var(--space);color:var(--star);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:18px 16px;display:flex;flex-direction:column;gap:10px;text-align:left}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pad > *:not(canvas){position:relative}
.pad .kicker{font-size:12px;font-weight:900;letter-spacing:.12em;color:var(--yellow)}
.pad h2{font-size:40px;font-weight:900;line-height:1;letter-spacing:.06em;color:#fff;text-shadow:3px 3px 0 var(--red)}
.pad .tower{position:absolute;right:14px;bottom:0;width:86px;height:150px}
.pad .go{align-self:flex-start;margin-top:6px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:3px 3px 0 var(--ink),0 0 0 0 rgba(255,210,63,.7)}50%{box-shadow:3px 3px 0 var(--ink),0 0 0 10px rgba(255,210,63,0)}}
@media (prefers-reduced-motion:reduce){.pad .go,.rocket-fly{animation:none!important}}

/* 标签页 */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{flex:1;border:2.5px solid var(--ink);background:var(--card);font-weight:900;font-size:14px;padding:7px 4px}
.tabs button[aria-selected="true"]{background:var(--yellow);box-shadow:2px 2px 0 var(--ink)}

/* 星图 */
.map{position:relative;background:var(--space);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);overflow:hidden}
.map canvas{display:block;width:100%}
.node{position:absolute;transform:translate(-50%,-50%);border:2.5px solid var(--ink);background:var(--card);font-weight:900;font-size:12px;padding:3px 7px;white-space:nowrap;box-shadow:2px 2px 0 var(--ink)}
.node.locked{background:#3a4a6b;color:#aab6cf;border-style:dashed;box-shadow:none}
.node.sel{background:var(--yellow)}
.node.final{background:var(--red);color:#fff}
.node.final.locked{background:#3a4a6b;color:#aab6cf}
.ringlabel{position:absolute;left:8px;font-size:10px;font-weight:700;color:#8fa3c8;pointer-events:none}
.detail{padding:12px;display:flex;flex-direction:column;gap:8px}
.detail h3{font-size:18px}
.req{display:flex;flex-wrap:wrap;gap:6px}
.req span{font-size:12px;font-weight:700;padding:1px 6px;border:1.5px solid var(--ink)}
.req .y{background:#d8f3dc}.req .n{background:#ffe0e0}
.hint{font-size:12px;background:#fffbe3;border:1.5px dashed var(--ink);padding:6px 8px}

/* 航行中 */
.voy{padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--space2);color:var(--star)}
.bar{height:16px;border:2.5px solid var(--ink);background:#0d1630;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--yellow);width:0}
.rocket-fly{display:inline-block;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}

/* 船员 */
.crew{display:grid;grid-template-columns:1fr;gap:10px}
.ceo{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px}
.ava{width:48px;height:48px;border:2.5px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;font-size:15px}
.lvdots{display:flex;gap:3px;margin-top:2px}
.lvdots i{width:14px;height:8px;border:1.5px solid var(--ink);background:var(--card)}
.lvdots i.on{background:var(--ink)}
.sumline{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;font-weight:900}

/* 科研 */
.sysbar{display:flex;gap:6px}
.sysbar button{flex:1;border:2.5px solid var(--ink);font-weight:900;padding:6px 2px;font-size:13px;background:var(--card)}
.sysbar button[aria-selected="true"]{color:#fff}
.tiers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.tiers button{border:2.5px solid var(--ink);background:var(--card);padding:6px 2px;font-weight:900;font-size:12px;line-height:1.3}
.tiers button[aria-selected="true"]{background:var(--yellow)}
.tiers button[disabled]{background:#ece8df;color:var(--mute);border-style:dashed}
.inv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.item{border:2px solid var(--ink);padding:6px 8px;background:var(--card);font-size:12px}
.item b{display:block;font-size:13px}
.item.empty{border-style:dashed;color:var(--mute);background:transparent}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px;font-size:12px;font-weight:700}

/* 收藏 */
.album{display:flex;flex-direction:column;gap:10px}
.route-row{padding:10px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:6px}
.sc{border:2px solid var(--ink);padding:6px;font-size:11px;min-height:64px;background:var(--card)}
.sc b{display:block;font-size:12px}
.sc.alien{background:#e7ffe9}
.sc.lock{border-style:dashed;color:var(--mute);background:transparent}
.hid{margin-top:6px;font-size:12px}

/* 弹窗 */
.modal{position:fixed;inset:0;z-index:20;background:rgba(20,20,20,.55);display:grid;place-items:center;padding:16px}
.sheet{width:100%;max-width:400px;max-height:88vh;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.sheet h3{font-size:20px}
.choices{display:grid;gap:8px}
.choices .btn{text-align:left;font-size:14px}
.choices .btn small{display:block;font-weight:700;font-size:11px;color:var(--sub)}
.reward{display:flex;flex-direction:column;gap:4px;font-weight:700}
.reward .big{font-size:22px;font-weight:900}
.panel4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.panel4 div{border:2.5px solid var(--ink);background:var(--card);padding:8px;font-size:12px;font-weight:700;min-height:78px}
.panel4 div:nth-child(4){background:var(--yellow)}

/* 鸣谢 */
.credits{background:var(--space);color:var(--star);padding:18px 16px;display:flex;flex-direction:column;gap:14px;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
.credits h2{font-size:28px;color:#fff;text-shadow:3px 3px 0 var(--red)}
.figs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.figs div{border:2px solid #8fa3c8;padding:8px}
.figs b{display:block;font-size:22px;color:var(--yellow);font-variant-numeric:tabular-nums}
.figs span{font-size:12px}
.tl{display:flex;flex-direction:column;gap:10px;border-left:3px solid var(--yellow);padding-left:12px}
.tl .d{display:block;font-size:11px;font-weight:900;color:var(--yellow);letter-spacing:.06em}
.tl q{display:block;font-size:14px;font-weight:700;color:#fff}
.tl q::before{content:"「"}.tl q::after{content:"」"}
.roll{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px}
.roll dt{font-weight:900;color:var(--yellow)}
.roll dd{margin:0}
.earth{padding:12px;display:flex;flex-direction:column;gap:8px;background:#e9f5ff}
.earth .bar{background:var(--card)}
.earth .bar i{background:var(--good)}

/* 演示工具 */
.dev{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--ink);color:var(--paper);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;font-size:12px}
.dev button{background:var(--paper);border:1.5px solid var(--paper);font-weight:700;font-size:12px;padding:3px 8px}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:30;background:#fffbe3;border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:8px 14px;font-weight:900;max-width:360px;width:calc(100% - 32px);text-align:center}

.credits .kick{font-size:12px;font-weight:900;letter-spacing:.12em;color:var(--yellow)}
.credits .sec{font-size:17px;color:#fff;margin-top:4px}
.credits .note{font-size:12px;color:#8fa3c8}
.comic{display:grid;grid-template-columns:1fr;gap:14px}
.cp{margin:0;background:var(--card);color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 #000;transform:rotate(var(--tilt));padding:6px}
.cp-art{position:relative;border:2.5px solid var(--ink);overflow:hidden}
.cp-art svg{display:block;width:100%;height:auto}
.cp figcaption{font-size:13px;font-weight:700;padding:6px 2px 0}
.bub{position:absolute;background:#fff;color:var(--ink);border:2.5px solid var(--ink);border-radius:14px;padding:4px 8px;font-size:12px;font-weight:900;line-height:1.35}
.bub::after{content:"";position:absolute;left:18px;bottom:-9px;width:12px;height:12px;background:#fff;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(45deg)}
.bub.static{position:relative;flex:1;min-width:0;font-size:14px}
.bub.static::after{left:-8px;top:18px;bottom:auto;border:0;border-left:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink)}
.bub.static b{color:var(--red)}
.first{margin:0;border:2.5px dashed var(--yellow);padding:10px 12px;font-size:14px;font-weight:700;color:#fff}
.first span{display:block;font-size:11px;color:var(--yellow);font-weight:900;margin-bottom:4px}
.cast{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mem{background:var(--card);color:var(--ink);border:2.5px solid var(--ink);box-shadow:3px 3px 0 #000;padding:6px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px}
.mem svg{width:100%;max-width:84px;height:auto}
.mem b{font-size:14px}.mem .r{font-size:11px;font-weight:700;color:var(--sub)}.mem .l{font-size:11px}
.hero-yang{display:flex;align-items:center;gap:12px}
.hero-yang svg{width:96px;flex:none}
.strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cell{background:var(--card);color:var(--ink);border:2.5px solid var(--ink);box-shadow:3px 3px 0 #000;padding:6px 8px 8px;transform:rotate(var(--tilt));display:flex;flex-direction:column;gap:2px}
.cell svg{width:100%;height:auto;background:#f7f1e3;border:2px solid var(--ink)}
.cell .when{font-size:11px;font-weight:900;color:var(--red)}
.cell b{font-size:13px}.cell .sub{font-size:11px;color:var(--sub)}
.cell.last{grid-column:1/-1;background:var(--yellow)}
.cell.last svg{max-height:120px}
@media (prefers-reduced-motion:reduce){.cp,.cell{transform:none}}

/* —— 美化 —— */
.credits{overflow:hidden;background:radial-gradient(circle at 20% 8%,rgba(255,210,63,.18),transparent 40%),radial-gradient(circle at 90% 30%,rgba(229,138,168,.16),transparent 45%),linear-gradient(180deg,#14213d,#232a5c 60%,#14213d);position:relative}
.credits h2,.credits .sec,.pad h2{font-family:var(--disp);font-weight:400;letter-spacing:.04em}
.credits h2{font-size:34px;line-height:1.15}
.credits .sec{font-size:22px;display:flex;align-items:center;gap:8px}
.credits .sec::before{content:"";width:14px;height:14px;background:var(--yellow);border:2.5px solid #000;transform:rotate(45deg)}
.figs div{background:rgba(255,255,255,.04);border:2px solid rgba(143,163,200,.6);border-radius:2px}
.figs b{font-family:var(--disp);font-weight:400;font-size:28px}
.comic{background:#fffaf0;border:3px solid #000;padding:8px;gap:8px;box-shadow:5px 5px 0 #000}
.cp{transform:none;box-shadow:none;border:0;padding:0;background:transparent}
.cp-art{border:3px solid var(--ink)}
.cp-date{position:absolute;left:-2px;top:-2px;background:var(--yellow);border:2.5px solid var(--ink);padding:1px 8px;font-size:12px;font-weight:900;color:var(--ink)}
.cp-cap{position:absolute;right:-2px;bottom:-2px;background:var(--card);color:var(--ink);border:2.5px solid var(--ink);padding:2px 10px;font-family:var(--disp);font-size:16px}
.cp.dark .cp-cap{background:var(--red);color:#fff}
.bub{box-shadow:2px 2px 0 rgba(0,0,0,.25)}
.mem{background:var(--card);border-radius:2px}
.mem svg{background:radial-gradient(circle at 50% 55%,var(--tint) 0 58%,transparent 59%)}
.mem b{font-family:var(--disp);font-weight:400;font-size:18px}
.hero-yang svg{width:120px;overflow:visible}
.cell{transform:none}
.cell .ic{border:2px solid var(--ink)}
.cell svg{background:transparent;border:0}
.cell.last .ic{background:#14213d!important}
.first{background:rgba(255,210,63,.08)}
.shipbox{padding:6px;background:#04060f}
.ship{display:block;width:100%;height:auto}
.ship .room{cursor:pointer}
.ghost *{fill:none!important;stroke:#7df9ff!important;stroke-dasharray:3 3;opacity:.45}
.own{filter:drop-shadow(0 0 1.5px rgba(125,249,255,.9))}
.roomcard{padding:12px;display:flex;flex-direction:column;gap:8px;background:#0f1726;color:#dbe7ff;border-color:#141414}
.roomcard h3{font-family:var(--disp);font-weight:400;font-size:22px;color:#fff}
.roomcard .muted{color:#9fb0cc}
.roomcard .tag{background:#7df9ff;border-color:#141414;color:#0b0f17}
.roomcard .hudline{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#7df9ff;letter-spacing:.06em}
.roomcard .lvdots i{border-color:#7df9ff;background:transparent}
.roomcard .lvdots i.on{background:#39ff88}
.unl{display:flex;flex-wrap:wrap;gap:6px}
.unl span{font-size:12px;font-weight:700;padding:1px 7px;border:1.5px solid #7df9ff}
.unl .y{background:#7df9ff;color:#0b0f17}.unl .n{border-style:dashed;color:#7df9ff;opacity:.6}
.roomcard .btn.ghost{background:#1b2740;color:#dbe7ff;border-color:#7df9ff}
.bigroom{border:2px solid #7df9ff;box-shadow:0 0 12px rgba(125,249,255,.35)}
.bigroom svg{display:block;width:100%;height:auto}
.blurb{font-size:13px;color:#dbe7ff}
.stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.stg{padding:0;border:1.5px solid #3a4760;background:#0b111c;color:#9fb0cc;font-size:10px;font-weight:700;display:flex;flex-direction:column}
.stg svg{display:block;width:100%;height:auto}
.stg span{padding:1px 0}
.stg.on{border-color:#7df9ff;color:#7df9ff;box-shadow:0 0 6px rgba(125,249,255,.6)}
.stg.lock svg{filter:brightness(.15) grayscale(1)}
.stg.lock{cursor:not-allowed}
.bigroom{position:relative;cursor:pointer}
.seereal{position:absolute;right:6px;top:6px;background:#7df9ff;color:#0b0f17;font-size:11px;font-weight:900;padding:1px 7px;border:1.5px solid #0b0f17}
.real{display:flex;flex-direction:column;gap:10px}
.real-art{position:relative;aspect-ratio:4/3;max-width:100%;overflow:hidden;border:3px solid var(--ink);background:#f7f1e3}
.real-art svg{position:absolute;inset:0;width:100%;height:100%;filter:blur(3px) saturate(.75) brightness(1.08);transform:scale(1.08)}
.real-art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(247,241,227,.15),rgba(247,241,227,.55) 70%,rgba(247,241,227,.85));pointer-events:none}
.real-art img{position:absolute;left:7%;top:9%;width:52%;max-width:none;z-index:1;border:6px solid #fffaf0;box-shadow:0 0 0 2px #141414,4px 6px 0 rgba(0,0,0,.35);transform:rotate(-3deg)}
.real-art .wip{position:absolute;right:8px;bottom:8px;z-index:2;max-width:42%;background:#fffaf0;border:2px solid var(--ink);font-size:11px;font-weight:900;padding:3px 6px;line-height:1.35}
.real-art .real-lv{position:absolute;left:8px;top:8px;z-index:2;background:var(--yellow);border:2px solid var(--ink);font-weight:900;font-size:12px;padding:0 7px}
.real details{font-size:13px;border:1.5px dashed var(--ink);padding:6px 8px;background:#fffbe3}
.real summary{font-weight:900;cursor:pointer}
.real-nav{display:flex;gap:6px;justify-content:space-between;flex-wrap:wrap}

/* —— 星图 —— */
.mapbox{padding:0;background:#04060f;overflow:hidden}
.mapsvg{display:block;width:100%;height:auto}
.pnode{cursor:pointer}
.pnode:focus{outline:none}
.pnode:focus-visible .reticle circle,.pnode:hover > g:first-of-type{filter:brightness(1.15)}
.plock{filter:grayscale(.85) brightness(.62)}
.reticle{animation:spin 8s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulse2 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse2{0%{transform:scale(.85);opacity:1}100%{transform:scale(1.15);opacity:.4}}
.pdetail{padding:12px;display:flex;flex-direction:column;gap:10px;background:#0f1726;color:#dbe7ff}
.pd-top{display:flex;gap:12px;align-items:center}
.pd-art{width:96px;height:96px;flex:none;border:2px solid #7df9ff;box-shadow:0 0 10px rgba(125,249,255,.3)}
.pd-txt{min-width:0;display:flex;flex-direction:column;gap:2px}
.pd-txt h3{font-family:var(--disp);font-weight:400;font-size:26px;color:#fff}
.pd-desc{font-size:13px}
.hudline{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#7df9ff;letter-spacing:.06em}
.hudline.dark{color:#2f6fb5}
.pdetail .req span{border-color:#7df9ff;color:#0b0f17}
.pd-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px}
.pd-stats span{border:1.5px solid #3a4760;padding:4px 6px;font-size:11px;display:flex;flex-direction:column}
.pd-stats b{font-size:16px;color:#fff;font-variant-numeric:tabular-nums}
.pd-stats .alienchip{border-color:#80ed99;color:#80ed99}
.pdetail .hint{background:#16233a;border-color:#7df9ff;color:#dbe7ff}
.btn.launch{font-size:17px;padding:11px}
.voy2{padding:0;background:#0f1726;color:#dbe7ff;display:flex;flex-direction:column}
.voy2 svg{display:block;width:100%;height:auto}
.voy-row{display:flex;justify-content:space-between;padding:6px 10px 0;font-weight:700}
.voy-row b{color:#ffd23f}
.voy-note{font-size:11px;color:#9fb0cc;padding:0 10px 8px}

/* —— 事件 / 结算 —— */
.evart{display:block;width:100%;height:auto;border:2.5px solid var(--ink)}
.rws{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.rw{border:2px solid var(--ink);padding:6px 8px;background:#e6f0ff;display:flex;flex-direction:column}
.rw b{font-size:22px;font-family:var(--disp);font-weight:400}
.rw span{font-size:11px;font-weight:700;color:var(--sub)}
.rw.gold{background:#fff4d6}.rw.alien{background:#e7ffe9}
.newcard{position:relative;padding-top:8px}
.nc-tag{position:absolute;top:0;left:8px;z-index:1;background:var(--red);color:#fff;font-size:11px;font-weight:900;padding:1px 8px;border:2px solid var(--ink)}
.sc2{border:2.5px solid var(--ink);background:var(--card);padding:5px;display:flex;flex-direction:column;gap:2px;font-size:11px;box-shadow:2px 2px 0 var(--ink)}
.sc2 .scart{display:block;width:100%;height:auto}
.sc2 b{font-size:12.5px}
.sc2 em{font-style:normal;font-weight:900;color:#2a9d8f;font-size:10.5px}
.sc2.alien{background:#effff1}
.sc2.lock{box-shadow:none;border-style:dashed;color:var(--mute);background:transparent}
.lockart{aspect-ratio:160/110;background:repeating-linear-gradient(45deg,#e6e1d6 0 6px,#ece8df 6px 12px);display:grid;place-items:center;font-weight:900;color:var(--mute)}
.newcard .sc2{max-width:240px}
.hidfound{border:2px dashed var(--ink);background:#f3e8ff;padding:6px 8px;font-weight:900}

/* —— 科研 —— */
.lab{padding:12px;display:flex;flex-direction:column;gap:10px}
.lab-head{display:flex;gap:10px;align-items:center}
.tiers button{border-top:5px solid var(--tc)}
.tiers button[aria-selected="true"]{background:var(--yellow)}
.inv2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ic2{position:relative;border:2.5px solid var(--tc);background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 18%,#fffaf0),#fffaf0 60%);padding:16px 6px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center;box-shadow:2px 2px 0 var(--ink)}
.ic2 b{font-size:12px}
.ic2-t{position:absolute;left:-2px;top:-2px;background:var(--tc);color:#fff;font-size:10px;font-weight:900;padding:0 6px}
.ic2-e{font-size:10.5px;color:var(--sub);font-weight:700}
.stars{color:#f4b400;font-size:12px;letter-spacing:1px}
.ic2.off{box-shadow:none;background:#f1ede4;border-style:dashed}
.ic2.off .ghost *{stroke:#9aa5b5!important}
.reveal{position:relative;display:grid;place-items:center;height:230px;overflow:hidden;background:radial-gradient(circle,color-mix(in srgb,var(--tc) 45%,#14213d),#0a1024 70%);border:2.5px solid var(--ink)}
.rv-rays{position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--tc) 55%,transparent) 0 8deg,transparent 8deg 22deg);animation:spin 14s linear infinite}
.rv-card{position:relative;background:#fffaf0;border:3px solid var(--tc);box-shadow:0 0 24px var(--tc);padding:18px 14px 8px;display:flex;flex-direction:column;align-items:center;animation:popin .5s cubic-bezier(.2,1.6,.4,1)}
.rv-card b{font-size:16px}
@keyframes popin{from{transform:scale(.3) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}

/* —— 收藏 —— */
.albumhead{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:8px}
.albumhead div{display:flex;flex-direction:column;align-items:center}
.albumhead b{font-family:var(--disp);font-weight:400;font-size:24px}
.albumhead span{font-size:11px;font-weight:700;color:var(--sub)}
.hidshelf{padding:10px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(180deg,#fffaf0,#f4efe2)}
.shelf{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.hs{display:flex;flex-direction:column;align-items:center;font-size:9.5px;font-weight:700;color:var(--mute);text-align:center;border-bottom:4px solid #c8743a;padding-bottom:2px}
.hs svg{width:100%;max-width:46px;height:auto;background:#ece8df;border-radius:50%}
.hs.on{color:var(--ink)}
.hs.on svg{background:radial-gradient(circle,#fff6c2,#ffe2b8)}
.rr-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.rr-head svg{background:#0a1024;border-radius:50%;flex:none}
.cards2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}

/* —— 结局 —— */
.endcomic{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;background:#fffaf0;padding:6px;border:2.5px solid var(--ink)}
.endcomic figure{margin:0;border:2px solid var(--ink);background:var(--card)}
.endcomic svg{display:block;width:100%;height:auto}
.endcomic figcaption{font-size:11px;font-weight:700;padding:4px 5px}

/* —— 入口 —— */
.pad2{position:relative;padding:0;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);background:#04060f;cursor:pointer;display:block;width:100%}
.pad2 svg{display:block;width:100%;height:auto}
.pad2 .padtitle{font-family:var(--disp)}
.pad2 .go{position:absolute;left:18px;bottom:16px;animation:pulse 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.reticle,.pulse,.rv-rays,.rv-card,.pad2 .go{animation:none!important}}
</style>

/* ========== 工具 ========== */
function fmt(n){
  n = Math.floor(n);
  if (n >= 1e12) return trim(n/1e12) + ' 万亿';
  if (n >= 1e8) return trim(n/1e8) + ' 亿';
  if (n >= 1e4) return trim(n/1e4) + ' 万';
  return String(n);
}
function trim(x){ return x >= 100 ? Math.floor(x).toString() : x >= 10 ? x.toFixed(1).replace(/\.0$/,'') : x.toFixed(2).replace(/\.?0+$/,''); }
function rint(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
function sum(s){ return s.lv.life + s.lv.med + s.lv.war + s.lv.tech; }
function alienMult(){ return 1 + ALIEN_ADD * S.alienCards; }
function rate(){ return BASE_RATE * alienMult(); }
function itemPower(tier, star){ return tier * 0.04 * (1 + 0.5*(star-1)); }
// 加成：cargo=探索点 / med=坏事件化解 / shield=胜率 / speed=航程 / radar=隐藏物
function stat(s, which){
  const map = {cargo:'life', med:'med', shield:'war', speed:'tech', radar:'tech'};
  let v = 0;
  Object.keys(s.items).forEach(id => { const [k,t] = id.split(':'); if (k === map[which]) v += itemPower(+t, s.items[id]); });
  if (which === 'radar' || which === 'speed') v *= 0.6;
  return Math.min(0.6, v);
}
function pct(x){ return Math.round(x*100) + '%'; }
function unlocked(r){
  if (sum(S) < RING_SUM[r.ring]) return false;
  if (r.need && S.lv[r.need[0]] < r.need[1]) return false;
  if (r.needAll && SYS.some(s => S.lv[s.k] < r.needAll)) return false;
  return true;
}
function esc(t){ return String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

let toastT = 0;
function toast(msg){
  let el = document.querySelector('.toast');
  if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role','status'); document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2200);
}

/* ========== 渲染 ========== */
const app = document.getElementById('app');
const layer = document.getElementById('layer');
let screen = 'street';

function hud(){
  return `<div class="hud"><div><div class="coin num" id="coinv">${fmt(S.coins)}</div>
    <div class="rate num">每秒 +${fmt(rate())}${S.alienCards ? ` · 外星加成 ×${alienMult().toFixed(2)}` : ''}</div></div>
    <div class="pts num">${S.pts}<small>探索点</small></div></div>`;
}


function renderHub(){
  const tabs = [['crew','飞船'],['map','星图'],['lab','科研'],['album','收藏']];
  let html = hud();
  if (S.ended) html += earthBox();
  html += `<div style="display:flex;gap:8px;align-items:center"><button class="btn ghost small" id="back">← 回到街上</button><span class="muted">科技公司 · 星途</span></div>`;
  html += voyageBox();
  html += `<div class="tabs" role="tablist">${tabs.map(([k,n]) => `<button role="tab" aria-selected="${S.tab===k}" data-tab="${k}">${n}</button>`).join('')}</div>`;
  html += `<div id="pane"></div>`;
  app.innerHTML = html;
  document.getElementById('back').onclick = () => { screen = 'street'; render(); };
  app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; save(); render(); });
  const pane = document.getElementById('pane');
  ({map:paneMap, crew:paneCrew, lab:paneLab, album:paneAlbum})[S.tab](pane);
  const eb = document.getElementById('buyEarth'); if (eb) eb.onclick = buyEarth;
  const rb = document.getElementById('recapBtn'); if (rb) rb.onclick = () => { screen = 'recap'; render(); };
}

function earthBox(){
  const p = Math.min(1, S.coins / EARTH);
  if (S.earth) return `<div class="box earth"><b>地球已经是你的了 🌏</b><span class="muted">称号「宇宙级摸鱼大王」已解锁。游戏照常经营，星途可以继续自由航行。</span><button class="btn small" id="recapBtn" style="align-self:flex-start">再看一次创业史</button></div>`;
  return `<div class="box earth"><div style="display:flex;justify-content:space-between;font-weight:900"><span>目标：买下地球</span><span class="num">${pct(p)}</span></div>
    <div class="bar"><i style="width:${p*100}%"></i></div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="muted num">标价 1000 万亿（金币上限）</span>
    <button class="btn small" id="buyEarth" ${S.coins >= EARTH ? '' : 'disabled'}>买下地球</button></div></div>`;
}

function launch(r){
  if (S.voyage || !unlocked(r)) return;
  const pool = EVENTS.slice(); if (r.ring >= 1 && !r.final) pool.push(ALIEN_EVENT, ALIEN_EVENT);
  const ev = r.final ? null : pool[Math.floor(Math.random()*pool.length)].id;
  S.voyage = {route:r.id, start:Date.now(), dur:Math.round(r.sec * 1000 * (1 - stat(S,'speed'))), ev};
  mark('launch'); save(); toast(`出发去${r.name}！`); render();
}

function drawSky(ctx, W, H, n){
  ctx.fillStyle = '#14213d'; ctx.fillRect(0,0,W,H);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < n; i++) { ctx.fillStyle = `rgba(233,241,255,${0.3 + rnd()*0.7})`; const s = rnd() < 0.15 ? 2.5 : 1.5; ctx.fillRect(rnd()*W, rnd()*H, s, s); }
}
function drawStars(cv, n){
  if (!cv) return; const W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * devicePixelRatio; cv.height = H * devicePixelRatio;
  const ctx = cv.getContext('2d'); ctx.scale(devicePixelRatio, devicePixelRatio); drawSky(ctx, W, H, n);
}

/* ========== 星图 ========== */
const MAP_W = 340, MAP_H = 470, MCX = 170, MCY = 500, MR = [128, 196, 262, 328, 398];
function nodePos(rt){
  const same = ROUTES.filter(x => x.ring === rt.ring), idx = same.indexOf(rt);
  const a = same.length === 1 ? 0 : (idx === 0 ? -1 : 1) * (rt.ring === 0 ? .52 : rt.ring === 3 ? .4 : .44);
  const R = MR[rt.ring];
  return [MCX + R * Math.sin(a), MCY - R * Math.cos(a)];
}
let VOYPATH = null;
function voyPoint(p){
  if (!VOYPATH) return [0,0,0];
  const {x0,y0,cx,cy,x1,y1} = VOYPATH, q = 1 - p;
  const x = q*q*x0 + 2*q*p*cx + p*p*x1, y = q*q*y0 + 2*q*p*cy + p*p*y1;
  const dx = 2*q*(cx-x0) + 2*p*(x1-cx), dy = 2*q*(cy-y0) + 2*p*(y1-cy);
  return [x, y, Math.atan2(dy, dx) * 180 / Math.PI + 90];
}
function mapSvg(){
  let s = `<svg class="mapsvg" viewBox="0 0 ${MAP_W} ${MAP_H}" role="img" aria-label="星图"><rect width="${MAP_W}" height="${MAP_H}" fill="url(#deep)"/>`;
  let seed = 23; const r = () => (seed = seed * 16807 % 2147483647) / 2147483647;
  for (let i = 0; i < 110; i++) s += `<circle cx="${(r()*MAP_W).toFixed(1)}" cy="${(r()*MAP_H).toFixed(1)}" r="${r() < .1 ? 1.3 : .6}" fill="#fff" opacity="${(.25 + r()*.65).toFixed(2)}"/>`;
  s += `<ellipse cx="250" cy="120" rx="120" ry="40" fill="#6b4fd8" opacity=".08" transform="rotate(-25 250 120)"/>`;
  MR.forEach((R, i) => {
    const open = sum(S) >= RING_SUM[i];
    s += `<circle cx="${MCX}" cy="${MCY}" r="${R}" fill="none" stroke="${open ? '#7df9ff' : '#5a6578'}" stroke-width="${open ? 1.2 : 1}" opacity="${open ? .45 : .5}" ${open ? '' : 'stroke-dasharray="4 6"'}/>`;
  });
  // 地球
  s += `<circle cx="${MCX}" cy="${MCY + 34}" r="104" fill="url(#atmo)"/><circle cx="${MCX}" cy="${MCY + 34}" r="92" fill="url(#earthG)"/><path d="M${MCX - 60} ${MCY - 30} q20 -22 46 -14 q18 6 10 22 q-26 10 -56 -8z M${MCX + 18} ${MCY - 50} q22 -6 34 8 q-8 14 -30 6z" fill="#5fae6a" opacity=".9"/><path d="M${MCX - 70} ${MCY - 34} q40 -30 120 -20" stroke="#fff" stroke-width="5" opacity=".25" fill="none" stroke-linecap="round"/>`;
  // 航线 + 飞船
  VOYPATH = null;
  if (S.voyage) {
    const [x1, y1] = nodePos(RBY[S.voyage.route]), x0 = MCX, y0 = MCY - 58;
    VOYPATH = {x0, y0, cx:(x0 + x1)/2 + (x1 > x0 ? -40 : 40), cy:(y0 + y1)/2, x1, y1};
    s += `<path d="M${x0} ${y0} Q${VOYPATH.cx} ${VOYPATH.cy} ${x1} ${y1}" fill="none" stroke="#ffd23f" stroke-width="1.6" stroke-dasharray="4 4" opacity=".85"/>`;
  }
  ROUTES.forEach(rt => {
    const [x, y] = nodePos(rt), open = unlocked(rt), sel = S.sel === rt.id, R = rt.final ? 20 : rt.ring >= 3 ? 17 : 15;
    s += `<g class="pnode" data-r="${rt.id}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})" tabindex="0" role="button" aria-label="${rt.name}">
      <circle r="${R + 12}" fill="transparent"/>
      <g${open ? '' : ' class="plock"'}>${planet(rt.id, R)}</g>
      ${sel ? `<g class="reticle"><circle r="${R + 9}" fill="none" stroke="#7df9ff" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M${-R-14} 0 h6 M${R+8} 0 h6 M0 ${-R-14} v6 M0 ${R+8} v6" stroke="#7df9ff" stroke-width="2"/></g>` : ''}
      ${open ? '' : `<g transform="translate(${R*.55} ${-R*.75})"><rect x="-5" y="-2" width="10" height="8" rx="1.5" fill="#cfd8e3" stroke="#0b0f17"/><path d="M-3 -2 v-3 a3 3 0 0 1 6 0 v3" fill="none" stroke="#cfd8e3" stroke-width="1.8"/></g>`}
      <g transform="translate(0 ${R + 15})"><rect x="${-rt.name.length*6.2 - 6}" y="-9" width="${rt.name.length*12.4 + 12}" height="14" rx="2" fill="#0a1424" fill-opacity=".8" stroke="${sel ? '#7df9ff' : '#3a4760'}" stroke-width="1"/><text text-anchor="middle" y="2" font-size="10.5" font-weight="700" fill="${open ? (rt.final ? '#ff8fab' : '#e9f1ff') : '#7a869c'}">${rt.name}</text></g>
    </g>`;
  });
  if (VOYPATH) { const [x, y, a] = voyPoint(Math.min(1, (Date.now() - S.voyage.start) / S.voyage.dur)); s += `<use id="mapship" href="#shipic" x="-10" y="-14" width="20" height="28" transform="translate(${x} ${y}) rotate(${a})"/>`; }
  return s + `</svg>`;
}

/* ========== 出航 / 事件 / 结算（覆盖旧版） ========== */
function arrive(){
  const v = S.voyage; S.voyage = null; save();
  const r = RBY[v.route];
  if (r.final) { showEnding(); return; }
  const ev = v.ev === 'alien' ? ALIEN_EVENT : EVENTS.find(e => e.id === v.ev);
  const sy = SYSK[ev.sys];
  modal(`${EV_ART[ev.id]()}<span class="hudline dark">◢ 航行事件 · 返航途中 · ${r.name}</span><h3>${ev.title}</h3><div>${ev.text}</div>
    <div class="choices"><button class="btn" data-c="a">${ev.a[0]}<small>${ev.a[1]}${ev.id === 'alien' ? '' : ` · ${sy.ceo} 的${sy.sys}越高越稳`}</small></button>
    <button class="btn ghost" data-c="b">${ev.b[0]}<small>${ev.b[1]}</small></button></div>`, el => {
    el.querySelectorAll('[data-c]').forEach(b => b.onclick = () => settle(r, ev, b.dataset.c));
  });
}
function settle(r, ev, c){
  let mult = 1, coinGain = 0, line = '', ok = true;
  if (ev.id === 'alien') {
    if (c === 'a') { coinGain = BASE_RATE * 3600 * (r.ring); line = ev.win; } else { mult = 1.3; line = '四个人和外星人拍了张合影，照片背面写着一串坐标。'; }
  } else if (c === 'a') {
    const base = {med:stat(S,'med'), war:stat(S,'shield'), life:stat(S,'cargo'), tech:stat(S,'radar')}[ev.sys];
    const p = Math.min(0.95, 0.35 + 0.1 * S.lv[ev.sys] + base);
    if (Math.random() < p) { mult = 1.5; line = ev.win; if (ev.fight) S.wins++; }
    else { ok = false; mult = 0.75; line = ev.lose; if (ev.fight) S.wins = 0; }
    line += `（成功率 ${pct(p)}）`;
  } else {
    if (ev.id === 'rock') { mult = 0.9; line = '绕了一大圈，平安到达。'; }
    else if (ev.id === 'pirate' || ev.id === 'food') { const fee = BASE_RATE * 600; S.coins = Math.max(0, S.coins - fee); line = `花了 ${fmt(fee)} 金币，平安无事。`; }
    else line = '什么也没发生，飞船继续往前。';
  }
  const pts = Math.round(rint(r.pts[0], r.pts[1]) * mult * (1 + stat(S,'cargo')) * (1 + 0.1*(S.lv.tech-1)));
  S.pts += pts; S.coins += coinGain;
  S.visits[r.id] = (S.visits[r.id]||0) + 1;
  const chips = [`<div class="rw"><b class="num">+${pts}</b><span>探索点</span></div>`];
  if (coinGain) chips.push(`<div class="rw gold"><b class="num">+${fmt(coinGain)}</b><span>外星生意金币</span></div>`);
  let cardHtml = '', extra = '';
  const n = S.cards[r.id] || 0;
  if (n < r.cards.length) {
    const card = r.cards[n]; S.cards[r.id] = n + 1; mark('card');
    cardHtml = `<div class="newcard"><span class="nc-tag">新剧情卡</span>${storyCard(r, n)}</div>`;
    if (card[0].startsWith('外星')) {
      S.alienCards++; mark('alien');
      const wf = BASE_RATE * 3600 * WINDFALL_H[r.ring];
      S.coins += wf;
      chips.push(`<div class="rw alien"><b class="num">×${alienMult().toFixed(2)}</b><span>四家店产速（永久 +25%）</span></div>`, `<div class="rw gold"><b class="num">+${fmt(wf)}</b><span>外星见面礼</span></div>`);
    }
  }
  if (!S.hidden[r.id] && r.hid.ok(S)) { S.hidden[r.id] = 1; mark('hidden'); extra = `<div class="hidfound">🎁 发现隐藏物「${r.hid.name}」</div>`; }
  S.coins = Math.min(S.coins, EARTH);
  save();
  modal(`<span class="hudline dark">◢ 返航报告 · ${r.name}</span><h3>${ok ? '平安返航' : '有点狼狈地返航'}</h3><div class="muted">${line}</div>
    <div class="rws">${chips.join('')}</div>${cardHtml}${extra}<button class="btn" data-close>收下</button>`);
}

/* ========== 科研：成果卡与抽取揭晓 ========== */
const TIER_C = ['#9aa5b5', '#2a9d8f', '#2f6fb5', '#9b5de5', '#f4b400'];
const TIER_N = ['普通', '精良', '稀有', '史诗', '传说'];
function itemArt(k, t, size){ return `<svg viewBox="-6 -4 50 52" width="${size || 56}" height="${size || 56}" aria-hidden="true"><g stroke="#0b0f17" stroke-width="2.2" stroke-linejoin="round">${IT[k][t-1]}</g></svg>`; }
function paneLab(pane){
  const s = SYSK[S.gsys], lv = S.lv[s.k];
  if (S.gtier > lv) S.gtier = lv;
  const cards = ITEMS[s.k].map((n, i) => { const t = i + 1, id = s.k + ':' + t, st = S.items[id];
    return st ? `<div class="ic2" style="--tc:${TIER_C[i]}"><span class="ic2-t">${TIER_N[i]}</span>${itemArt(s.k, t)}<b>${n}</b><span class="stars">${'★'.repeat(st)}${'☆'.repeat(3-st)}</span><span class="ic2-e">${s.stat} +${pct(itemPower(t, st))}</span></div>`
              : `<div class="ic2 off" style="--tc:${TIER_C[i]}"><span class="ic2-t">${t} 级</span><div class="ghost">${itemArt(s.k, t)}</div><b>？？？</b><span class="ic2-e">${t > lv ? `科研 ${t} 级可抽` : '还没抽到'}</span></div>`; }).join('');
  pane.innerHTML = `<div class="box lab">
    <div class="sysbar" role="tablist">${SYS.map(x => `<button role="tab" aria-selected="${S.gsys===x.k}" data-g="${x.k}" style="${S.gsys===x.k ? `background:${x.hex}` : ''}">${x.sys}</button>`).join('')}</div>
    <div class="lab-head"><svg viewBox="-4 -6 108 126" width="54" height="64" aria-hidden="true"><use href="#ceo-${s.k}"/></svg><div><b>${s.ceo} 的研究台</b><div class="muted">科研 ${lv} 级 · 能抽 ${lv} 级及以下的成果</div></div></div>
    <div class="tiers">${[1,2,3,4,5].map(t => `<button data-t="${t}" aria-selected="${S.gtier===t}" ${t > lv ? 'disabled' : ''} style="--tc:${TIER_C[t-1]}">${TIER_N[t-1]}<br><span class="num">${fmt(TIER_PRICE[t-1])}</span></button>`).join('')}</div>
    <button class="btn" id="roll" ${S.coins >= TIER_PRICE[S.gtier-1] ? '' : 'disabled'}>花 ${fmt(TIER_PRICE[S.gtier-1])} 金币研发一次</button>
    <div class="muted">出货：本档 70%，低一档 25%，低两档 5%。重复的会升星，最多 3 星。</div>
    <div class="inv2">${cards}</div>
    <div class="stats"><span>探索点 +${pct(stat(S,'cargo'))}</span><span>坏事件化解 +${pct(stat(S,'med'))}</span><span>遭遇战胜率 +${pct(stat(S,'shield'))}</span><span>航程 −${pct(stat(S,'speed'))} · 雷达 +${pct(stat(S,'radar'))}</span></div>
  </div>`;
  pane.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { S.gsys = b.dataset.g; save(); render(); });
  pane.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { S.gtier = +b.dataset.t; save(); render(); });
  document.getElementById('roll').onclick = roll;
}
function roll(){
  const t = S.gtier, price = TIER_PRICE[t-1];
  if (S.coins < price) return;
  S.coins -= price;
  const x = Math.random(); let got = x < 0.7 ? t : x < 0.95 ? t-1 : t-2; got = Math.max(1, got);
  const k = S.gsys, id = k + ':' + got, name = ITEMS[k][got-1];
  let msg, isNew = false;
  mark('tech');
  if (!S.items[id]) { S.items[id] = 1; isNew = true; msg = '新成果'; }
  else if (S.items[id] < 3) { S.items[id]++; msg = `升到 ${S.items[id]} 星`; }
  else { S.coins += price/2; msg = '已满星，退回一半金币'; }
  save(); render();
  modal(`<div class="reveal" style="--tc:${TIER_C[got-1]}"><div class="rv-rays"></div><div class="rv-card"><span class="ic2-t">${TIER_N[got-1]}</span>${itemArt(k, got, 110)}<b>${name}</b><span class="stars">${'★'.repeat(S.items[id])}${'☆'.repeat(3-S.items[id])}</span></div></div>
    <h3 style="text-align:center">${isNew ? '研发成功！' : msg}</h3><div class="muted" style="text-align:center">${SYSK[k].ceo} 的${SYSK[k].sys}系统 · ${got} 级成果${isNew ? '，已经摆进飞船里了' : ''}</div>
    <div style="display:flex;gap:8px;justify-content:center"><button class="btn ghost" data-close>好</button><button class="btn" id="again" ${S.coins >= price ? '' : 'disabled'}>再来一次</button></div>`, el => {
    el.querySelector('#again').onclick = () => { closeModal(); roll(); };
  });
}

  saturn:`<circle cx="25" cy="25" r="14" fill="#cfd8e3" stroke="#0b0f17" stroke-width="1.5"/><circle cx="25" cy="25" r="4" fill="#0b0f17"/><path d="M14 20 a12 12 0 0 1 10 -8" stroke="#c9a7ff" stroke-width="2.5" fill="none"/><path d="M36 30 a12 12 0 0 1 -10 8" stroke="#7df9ff" stroke-width="2.5" fill="none"/>`,
  signal:`<rect x="10" y="14" width="30" height="20" fill="#fffaf0" stroke="#0b0f17" stroke-width="1.5"/><path d="M10 14 l15 11 l15 -11" fill="none" stroke="#0b0f17" stroke-width="1.5"/><circle cx="36" cy="32" r="5" fill="#e63946" stroke="#0b0f17"/>`,
};
function paneAlbum(pane){
  const totalCards = ROUTES.reduce((a,r) => a + r.cards.length, 0);
  const gotCards = ROUTES.reduce((a,r) => a + (S.cards[r.id]||0), 0);
  const gotHid = Object.keys(S.hidden).length;
  pane.innerHTML = `<div class="box albumhead"><div><b class="num">${gotCards}/${totalCards}</b><span>剧情卡</span></div><div><b class="num">${gotHid}/${ROUTES.length}</b><span>隐藏物</span></div><div><b class="num">${S.alienCards}/7</b><span>外星剧情</span></div></div>
  <div class="box hidshelf"><b>隐藏物展柜</b><div class="shelf">${ROUTES.map(r => S.hidden[r.id]
      ? `<div class="hs on" title="${r.hid.name}"><svg viewBox="0 0 50 50" aria-hidden="true">${HID_ART[r.id]}</svg><span>${r.hid.name}</span></div>`
      : `<div class="hs"><svg viewBox="0 0 50 50" aria-hidden="true"><text x="25" y="32" text-anchor="middle" font-size="22" fill="#9aa5b5">?</text></svg><span>${r.name}</span></div>`).join('')}</div></div>
  <div class="album">${ROUTES.map(r => `<div class="box route-row"><div class="rr-head"><svg viewBox="-30 -30 60 60" width="34" height="34" aria-hidden="true">${planet(r.id, 17)}</svg><b>${r.name}</b><span class="muted">${RING[r.ring]}</span></div>
    <div class="cards2">${r.cards.map((c,i) => i < (S.cards[r.id]||0) ? storyCard(r, i)
      : `<div class="sc2 lock"><div class="scart lockart"><span>第 ${i+1} 张</span></div><b>？？？</b><span>${c[0].startsWith('外星') ? '外星剧情 · 产速 +25%' : '出航解锁'}</span></div>`).join('')}</div></div>`).join('')}</div>`;
}

/* ========== 结局四格 ========== */
function streetPanel(n){
  const lit = n >= 1, all = n >= 3;
  const shops = [['#c8743a', n >= 1], ['#e58aa8', n >= 1], ['#2f6fb5', n >= 2], ['#7a7a72', n >= 2]];
  let s = `<rect width="320" height="200" fill="${all ? '#2b1838' : '#0d1424'}"/>${stars(30,0,0,320,90,5 + n)}`;
  if (all) s += `<rect width="320" height="200" fill="#ffb347" opacity=".12"/>`;
  s += `<rect y="160" width="320" height="40" fill="#2a2f3a"/>`;
  shops.forEach(([c, on], i) => {
    const x = 14 + i*76;
    s += `<rect x="${x}" y="84" width="66" height="76" fill="${on ? '#fffaf0' : '#3a4556'}" stroke="#0b0f17" stroke-width="2"/><path d="M${x-4} 84 h74 l-6 -16 h-62z" fill="${on ? c : '#56647d'}" stroke="#0b0f17" stroke-width="2"/><rect x="${x+20}" y="116" width="26" height="44" fill="${on ? '#ffd23f' : '#1b2433'}" stroke="#0b0f17" stroke-width="1.5"/>`;
    if (on) s += `<rect x="${x-6}" y="110" width="78" height="60" fill="#ffd23f" opacity=".15"/>`;
  });
  if (all) s += `<path d="M0 60 Q80 80 160 60 T320 60" fill="none" stroke="#0b0f17"/>${[20,60,100,140,180,220,260,300].map((x,i) => `<circle cx="${x}" cy="${66 + Math.sin(i)*6}" r="5" fill="${['#ffd23f','#ff8fab','#7df9ff'][i%3]}"/>`).join('')}`;
  return s;
}
const ENDING = [
  {cap:'一条很普通的街，四家店，灯都还没开。', art:() => streetPanel(0)},
  {cap:'77 的烤架冒起烟，珍珠姐煮好第一锅珍珠。', art:() => streetPanel(1) + `<use href="#ceo-life" x="20" y="112" width="52" height="64"/><use href="#ceo-med" x="96" y="112" width="52" height="64"/><path d="M40 100 q-6 -12 2 -22 M52 100 q-6 -12 2 -22" stroke="#fff" stroke-width="3" opacity=".5" fill="none"/>`},
  {cap:'阿宅把书架摆满，火箭老板的服务器亮了。', art:() => streetPanel(2) + `<use href="#ceo-war" x="172" y="112" width="52" height="64"/><use href="#ceo-tech" x="248" y="112" width="52" height="64"/>`},
  {cap:'一条街的灯全亮了。', art:() => streetPanel(3) + ['life','med','war','tech'].map((k,i) => `<use href="#ceo-${k}" x="${22 + i*76}" y="112" width="52" height="64"/>`).join('') + `<g transform="translate(160 30)"><rect x="-62" y="-14" width="124" height="28" rx="4" fill="#fffaf0" stroke="#0b0f17" stroke-width="2"/><text text-anchor="middle" y="6" font-size="15" font-weight="900" fill="#e63946">欢迎回家</text></g>`},
];
function showEnding(){
  S.hidden.signal = 1; S.cards.signal = 1; mark('reply'); save();
  modal(`<span class="hudline dark">◢ 未知信号源 · 已解码</span><h3>回信</h3><div class="muted">信号是一段漫画。四个人一格一格看下去。</div>
    <div class="endcomic">${ENDING.map((p, i) => `<figure><svg viewBox="0 0 320 200" aria-hidden="true">${p.art()}</svg><figcaption>${i + 1} · ${p.cap}</figcaption></figure>`).join('')}</div>
    <button class="btn" data-credits>看制作手记 →</button>`, el => {
    el.querySelector('[data-credits]').onclick = () => { closeModal(); S.ended = true; save(); screen = 'credits'; render(); };
  });
}

/* ========== 街道入口 ========== */
function renderStreet(){
  const shops = [['烧烤摊',110,82,'#c8743a'],['奶茶店',93,71,'#e58aa8'],['漫画书店',79,63,'#2f6fb5'],['科技公司',69,55,'#7a7a72']];
  app.innerHTML = hud() + `
  <div class="street">${shops.map(([n,max,lv,c]) => `<div class="box shop" style="border-top:8px solid ${c}"><b>${n}</b><span class="muted num">Lv ${lv} / ${max}</span><span class="ok">已过 Lv50 ✓</span></div>`).join('')}</div>
  <button class="pad2" id="enter" aria-label="进入星途">
    <svg viewBox="0 0 360 300" aria-hidden="true"><rect width="360" height="300" fill="url(#deep)"/>${stars(60,0,0,360,220,77)}
      <path d="M296 300 L150 30 L190 30z" fill="#7df9ff" opacity=".07"/><path d="M296 300 L360 20 L330 20z" fill="#ffd23f" opacity=".07"/>
      <circle cx="190" cy="52" r="20" fill="#c9ccd3"/><circle cx="190" cy="52" r="20" fill="url(#pshade)"/>
      <rect y="250" width="360" height="50" fill="#1b2433"/><path d="M0 250 H360" stroke="#7df9ff" stroke-width="1.5" opacity=".6"/>
      <g transform="translate(236 70)"><rect x="0" y="0" width="12" height="180" fill="url(#metalD)" stroke="#0b0f17" stroke-width="1.5"/>${[30,70,110,150].map(y => `<path d="M12 ${y} h40" stroke="#56647d" stroke-width="4"/><path d="M0 ${y-20} L12 ${y}" stroke="#56647d" stroke-width="2"/>`).join('')}<circle cx="6" cy="-4" r="4" fill="#ff3b3b"/></g>
      <g transform="translate(266 30)"><path d="M30 0 q30 40 30 120 v60 h-60 v-60 q0-80 30-120z" fill="url(#metal)" stroke="#0b0f17" stroke-width="2.5"/><circle cx="30" cy="70" r="12" fill="url(#dome)" stroke="#0b0f17" stroke-width="2.5"/><path d="M0 150 l-22 40 h22z M60 150 l22 40 h-22z" fill="#e63946" stroke="#0b0f17" stroke-width="2.5"/><path d="M0 120 h60" stroke="#e63946" stroke-width="5"/><path d="M10 180 q20 40 40 0z" fill="url(#plasma)"/></g>
      <text x="22" y="54" font-size="12" font-weight="900" fill="#ffd23f" letter-spacing="3">科技公司 · 发射台</text>
      <text x="20" y="112" font-size="54" font-weight="400" fill="#fff" class="padtitle" style="paint-order:stroke" stroke="#e63946" stroke-width="6">星途</text>
      <text x="22" y="140" font-size="12.5" font-weight="700" fill="#dbe7ff">四位 CEO 开飞船去太空。</text><text x="22" y="160" font-size="12.5" font-weight="700" fill="#dbe7ff">最后一站，是一个没人去过的信号。</text></svg>
    <span class="btn go">登船 →</span>
  </button>
  <div class="box" style="padding:10px 12px;font-size:12px">
    <b>开放条件（提议）</b>：四家店都开张，并且都升过 Lv50（最后一个里程碑）。没达到时，这块发射台是灰的，写着还差哪家店几级。
  </div>`;
  document.getElementById('enter').onclick = () => { screen = 'hub'; render(); };
}

/* ========== 主循环 ========== */
function render(){
  if (screen === 'street') renderStreet();
  else if (screen === 'credits') renderCredits();
  else if (screen === 'recap') renderRecap();
  else renderHub();
}
let last = Date.now();
setInterval(() => {
  const now = Date.now(), dt = (now - last) / 1000; last = now;
  S.coins = Math.min(EARTH, S.coins + rate() * dt);
  const cv = document.getElementById('coinv'); if (cv) cv.textContent = fmt(S.coins);
  if (S.voyage) {
    const v = S.voyage, p = Math.min(1, (now - v.start) / v.dur);
    const vs = document.getElementById('voyship'); if (vs) vs.setAttribute('transform', `translate(${24 + p*240} 27) rotate(90)`);
    const ms = document.getElementById('mapship'); if (ms && VOYPATH) { const [x, y, a] = voyPoint(p); ms.setAttribute('transform', `translate(${x} ${y}) rotate(${a})`); }
    const lf = document.getElementById('voyleft'); if (lf) lf.textContent = Math.max(0, Math.ceil((v.dur - (now - v.start))/1000)) + ' 秒';
    if (p >= 1 && !layer.innerHTML) { arrive(); render(); }
  }
  const eb = document.getElementById('buyEarth'); if (eb) eb.disabled = S.coins < EARTH;
}, 200);
setInterval(save, 3000);

/* 演示工具 */
document.getElementById('d-coin').onclick = () => { S.coins = Math.min(EARTH, S.coins + 5e12); save(); render(); toast('+5 万亿金币'); };
document.getElementById('d-pts').onclick = () => { S.pts += 500; save(); render(); toast('+500 探索点'); };
document.getElementById('d-max').onclick = () => { SYS.forEach(s => S.lv[s.k] = 5); save(); render(); toast('四位 CEO 都是 5 级了'); };
document.getElementById('d-end').onclick = () => { SYS.forEach(s => S.lv[s.k] = 5); S.voyage = null; screen = 'hub'; save(); showEnding(); };
document.getElementById('d-earth').onclick = () => { S.coins = EARTH; S.ended = true; screen = 'hub'; save(); render(); toast('钱够了，去买地球吧'); };
document.getElementById('d-reset').onclick = () => { S = fresh(); screen = 'street'; closeModal(); save(); render(); };
window.addEventListener('resize', () => { if (screen === 'hub' && !layer.innerHTML) render(); });

document.getElementById('defs').innerHTML = defsSvg().replace('</defs>', spaceDefs() + '</defs>');
if (S.voyage || S.ended) screen = 'hub';
render();
})();
</script>
